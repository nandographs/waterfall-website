# O Asaas chama o webhook sem JWT do Supabase; a função confere o token do webhook
# (ASAAS_WEBHOOK_TOKEN) e valida a cobrança direto na API do Asaas.
[functions.asaas-webhook]
verify_jwt = false

# Antigo, do Mercado Pago. Fica até não haver pedido pendente por lá.
[functions.mp-webhook]
verify_jwt = false

# O site chama estas funções só com a publishable key (não é JWT). Elas validam a entrada
# e usam a service role internamente.
[functions.create-checkout]
verify_jwt = false

[functions.track-click]
verify_jwt = false
